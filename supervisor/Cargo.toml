[package]
name = "alimiel"
version = "0.1.0"
edition = "2024"
description = "Almadel supervisor: out-of-process Rust worker that polls the Almadel server and runs tickets"
license = "MIT"

[[bin]]
name = "alimiel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
